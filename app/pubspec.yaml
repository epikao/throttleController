name: throttle_dashboard
description: eBike throttle controller dashboard
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  usb_serial: ^0.5.0              # Android (USB OTG)
  provider: ^6.1.2
  path_provider: ^2.1.0           # File storage

dev_dependencies:
  flutter_libserialport: ^0.6.0   # Windows / Linux / macOS (Desktop only)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
