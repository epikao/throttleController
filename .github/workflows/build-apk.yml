name: Build APK

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned: must stay in the Gradle 8 era. The old serial plugins
          # (usb_serial, flutter_libserialport) call jcenter(), which was
          # removed in Gradle 9 (Flutter >= ~3.3x templates).
          flutter-version: '3.29.3'
          channel: 'stable'

      - name: Get dependencies
        run: cd app && flutter pub get

      - name: Build APK
        run: cd app && flutter build apk --release

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/app/outputs/apk/release/app-release.apk
